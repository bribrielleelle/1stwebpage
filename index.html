<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bri'elle Davis</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffb3d1, #a8c5ff);
            color: #333;
            text-align: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-[#bec0fa]">Bri'elle Davis</h1>
        <img src="images/cottoncandy.jpg" alt="Cotton Candy" style="max-width: 100%; height: auto; margin: 1rem 0;">
        <p><a class="border-t-[#f2bbee] border-r-[#f2bbee] border-b-[#f2bbee] border-l-[#f2bbee] text-[#edadd7]" href="https://www.instagram.com/bribrielleelle/" target="_blank">Date of Birth: October 18th, 2011</a></p>
    </div>
</body>
</html>
